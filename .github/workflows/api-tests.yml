name: API Tests

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
     db:
       image: postgres:15
       env:
         POSTGRES_DB: bank
         POSTGRES_USER: admin
         POSTGRES_PASSWORD: admin
       ports:
         - 5432:5432
       options: >-
         --health-cmd="pg_isready"
         --health-interval=10s
         --health-timeout=5s
         --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Show Java & Maven versions
        run: |
          java -version
          mvn -v

      - name: Run API tests
        run: |
          mvn clean verify -DincludeTags=api -Djacoco.outputDir=target/jacoco-api

      - name: Upload Jacoco HTML report for API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-api-report
          path: target/jacoco-apió

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-api-reports
          path: target/surefire-reports